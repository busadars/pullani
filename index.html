<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Girls Fest '26 - Management Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-pink-500/30">

    <div id="toast" class="fixed top-5 right-5 z-[100] transform translate-y-[-200%] transition-transform duration-300 bg-pink-600 text-white px-6 py-3 rounded-xl shadow-2xl shadow-pink-900/50 font-semibold flex items-center space-x-2 border border-pink-500">
        <span id="toastMsg">Action completed successfully!</span>
    </div>

    <div id="app" class="flex-1 flex flex-col w-full min-h-screen"></div>

    <script>
        const STORAGE_KEY = "aura_girls_fest_data_v3"; // Updated key to refresh local data

        let defaultData = {
            loggedInTeam: null,
            currentTab: 'dashboard', // dashboard, candidates, programmes, results
            teams: {
                teamA: { id: 'teamA', name: 'Al-Shams', fullName: 'Al-Shams (Team Alpha)', pass: 'shams26', color: 'rose' },
                teamB: { id: 'teamB', name: 'Al-Qamar', fullName: 'Al-Qamar (Team Beta)', pass: 'qamar26', color: 'indigo' }
            },
            candidates: [
                { id: 1, name: 'Fathima Zohra', team: 'teamA', category: 'Senior', regNo: 'S001' },
                { id: 2, name: 'Aysha Mariyam', team: 'teamB', category: 'Junior', regNo: 'J001' }
            ],
            programmes: [
                // Junior Programmes
                { id: 'J1', name: 'ഖിറാഅത്ത് (Qiraat)', type: 'stage', category: 'Junior', code: 'J01' },
                { id: 'J2', name: 'മദ്ഹ് സോങ് (Madh Song)', type: 'stage', category: 'Junior', code: 'J02' },
                { id: 'J3', name: 'കഥ പറച്ചിൽ (Story Telling)', type: 'stage', category: 'Junior', code: 'J03' },
                { id: 'J4', name: 'പെൻസിൽ ഡ്രോയിംഗ് (Pencil Drawing)', type: 'nonstage', category: 'Junior', code: 'J04' },
                { id: 'J5', name: 'പെയിന്റിംഗ് (Painting)', type: 'nonstage', category: 'Junior', code: 'J05' },
                { id: 'J6', name: 'മെമ്മറിടെസ്റ്റ് (Memory Test)', type: 'nonstage', category: 'Junior', code: 'J06' },
                { id: 'J7', name: 'കയ്യെഴുത്ത് (Handwriting)', type: 'nonstage', category: 'Junior', code: 'J07' },
                { id: 'J8', name: 'ചിത്ര രചന (Drawing)', type: 'nonstage', category: 'Junior', code: 'J08' },
                { id: 'J9', name: 'സ്പെല്ലിംഗ് ബി (Spelling Bee)', type: 'nonstage', category: 'Junior', code: 'J09' },
                { id: 'J10', name: 'ഗ്രന്ഥ വായന (Book Reading)', type: 'nonstage', category: 'Junior', code: 'J10' },

                // Senior Programmes
                { id: 'S1', name: 'ഖിറാഅത്ത് (Qiraat)', type: 'stage', category: 'Senior', code: 'S01' },
                { id: 'S2', name: 'സിംഗിൾ സോങ് മദ്ഹ് (Single Song)', type: 'stage', category: 'Senior', code: 'S02' },
                { id: 'S3', name: 'മാലപ്പാട്ട് (Malappattu)', type: 'stage', category: 'Senior', code: 'S03' },
                { id: 'S4', name: 'പ്രസംഗം മലയാളം (Malayalam Speech)', type: 'stage', category: 'Senior', code: 'S04' },
                { id: 'S5', name: 'ഇംഗ്ലീഷ് പ്രസംഗം (English Speech)', type: 'stage', category: 'Senior', code: 'S05' },
                { id: 'S6', name: 'കവിതാലാപനം (Poem Recitation)', type: 'stage', category: 'Senior', code: 'S06' },
                { id: 'S7', name: 'മെമ്മറിടെസ്റ്റ് (Memory Test)', type: 'nonstage', category: 'Senior', code: 'S07' },
                { id: 'S8', name: 'പതപയറ്റ് (Word Contest)', type: 'nonstage', category: 'Senior', code: 'S08' },
                { id: 'S9', name: 'എഴുത്ത് (Writing)', type: 'nonstage', category: 'Senior', code: 'S09' },
                { id: 'S10', name: 'കാലിഗ്രാഫി (Calligraphy)', type: 'nonstage', category: 'Senior', code: 'S10' },
                { id: 'S11', name: 'ഗ്രന്ഥ വായന (Book Reading)', type: 'nonstage', category: 'Senior', code: 'S11' },

                // General Programmes
                { id: 'G1', name: 'ബുർദ (Burdah)', type: 'stage', category: 'General', code: 'G01' },
                { id: 'G2', name: 'ഗ്രൂപ്പ് സോങ് (Group Song)', type: 'stage', category: 'General', code: 'G02' },
                { id: 'G3', name: 'ക്വിസ് (Quiz)', type: 'nonstage', category: 'General', code: 'G03' },
                { id: 'G4', name: 'മെഗസിൻ (Magazine)', type: 'nonstage', category: 'General', code: 'G04' },
                { id: 'G5', name: 'കൊളാഷ് (Collage)', type: 'nonstage', category: 'General', code: 'G05' },
                { id: 'G6', name: 'പത്രനിർമ്മാണം (Newspaper Making)', type: 'nonstage', category: 'General', code: 'G06' },
                { id: 'G7', name: 'നാനോ ലിറ്ററേച്ചർ (Nano Literature)', type: 'nonstage', category: 'General', code: 'G07' },
                { id: 'G8', name: 'അടിക്കുറിപ്പ് (Caption Writing)', type: 'nonstage', category: 'General', code: 'G08' },
                { id: 'G9', name: 'തലവാചക നിർമ്മാണം (Headline Making)', type: 'nonstage', category: 'General', code: 'G09' }
            ],
            results: [] // Format: { progId, first: candId, second: candId, third: candId, published: boolean }
        };

        let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultData;
        
        // UI temporary states
        let showResultModalFor = null;

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            toast.classList.remove('translate-y-[-200%]');
            setTimeout(() => {
                toast.classList.add('translate-y-[-200%]');
            }, 3000);
        }

        function switchTab(tab) {
            state.currentTab = tab;
            saveState();
            render();
        }

        // Logic: Calculate Points based on 1st(5), 2nd(3), 3rd(1)
        function getTeamPoints(teamId) {
            let points = 0;
            state.results.forEach(res => {
                if (!res.published) return;
                if (res.first) {
                    let c = state.candidates.find(c => c.id == res.first);
                    if (c && c.team === teamId) points += 5;
                }
                if (res.second) {
                    let c = state.candidates.find(c => c.id == res.second);
                    if (c && c.team === teamId) points += 3;
                }
                if (res.third) {
                    let c = state.candidates.find(c => c.id == res.third);
                    if (c && c.team === teamId) points += 1;
                }
            });
            return points;
        }

        function render() {
            const app = document.getElementById('app');
            if (!state.loggedInTeam) {
                app.innerHTML = renderLoginScreen();
            } else {
                app.innerHTML = renderAppLayout();
                attachEventListeners();
            }
        }

        function renderLoginScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-pink-950">
                    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-8 backdrop-blur-xl relative overflow-hidden">
                        <div class="absolute top-[-50px] right-[-50px] w-32 h-32 bg-pink-600/20 rounded-full blur-3xl"></div>
                        <div class="text-center mb-8 relative z-10">
                            <span class="bg-pink-500/10 text-pink-400 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-widest border border-pink-500/20">Girls Arts Fest 2026</span>
                            <h1 class="text-3xl font-extrabold text-white mt-4 tracking-tight">Aura Fest Portal</h1>
                            <p class="text-slate-400 text-sm mt-2">Sign in with your team credentials to manage candidates & events.</p>
                        </div>

                        <form id="loginForm" class="space-y-5 relative z-10">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Select Account</label>
                                <select id="loginTeam" class="w-full bg-slate-950/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500 transition shadow-inner">
                                    <option value="teamA">Al-Shams (Team Alpha) - Pass: shams26</option>
                                    <option value="teamB">Al-Qamar (Team Beta) - Pass: qamar26</option>
                                    <option value="admin">Main Admin - Pass: admin26</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                                <input type="password" id="loginPass" required placeholder="Enter password" class="w-full bg-slate-950/50 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-pink-500 transition shadow-inner">
                            </div>

                            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-bold rounded-xl shadow-lg shadow-pink-600/30 transition transform active:scale-95">
                                Secure Login
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderAppLayout() {
            let userTitle = state.loggedInTeam === 'admin' ? 'System Administrator' : state.teams[state.loggedInTeam].fullName;
            let navItems = [
                { id: 'dashboard', icon: '📊', label: 'Dashboard' },
                { id: 'candidates', icon: '👥', label: 'Candidates' },
                { id: 'programmes', icon: '📋', label: 'Programmes' },
                { id: 'results', icon: '🏆', label: 'Results' }
            ];

            let contentHTML = '';
            if (state.currentTab === 'dashboard') contentHTML = renderDashboardTab();
            if (state.currentTab === 'candidates') contentHTML = renderCandidatesTab();
            if (state.currentTab === 'programmes') contentHTML = renderProgrammesTab();
            if (state.currentTab === 'results') contentHTML = renderResultsTab();

            // Result Modal overlay if active
            let modalHTML = showResultModalFor ? renderResultModal() : '';

            return `
                <div class="flex h-screen overflow-hidden">
                    <!-- Sidebar -->
                    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col hidden md:flex">
                        <div class="p-6 border-b border-slate-800">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-pink-500 to-rose-600 flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-pink-500/30 mb-3">✨</div>
                            <h2 class="font-bold text-white text-lg">Aura Fest '26</h2>
                            <p class="text-xs text-slate-400 mt-1">Logged in as:</p>
                            <p class="text-sm font-semibold text-pink-400 truncate">${userTitle}</p>
                        </div>
                        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                            ${navItems.map(nav => `
                                <button onclick="switchTab('${nav.id}')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition-all ${state.currentTab === nav.id ? 'bg-pink-600/10 text-pink-400 border border-pink-500/20' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}">
                                    <span class="text-lg">${nav.icon}</span>
                                    <span class="font-medium">${nav.label}</span>
                                </button>
                            `).join('')}
                        </nav>
                        <div class="p-4 border-t border-slate-800">
                            <button id="logoutBtn" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-semibold transition border border-slate-700">Logout</button>
                        </div>
                    </aside>

                    <!-- Main Content Area -->
                    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-950 relative">
                        <!-- Mobile Header -->
                        <header class="md:hidden bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between z-20">
                            <h2 class="font-bold text-white">✨ Aura Fest</h2>
                            <select onchange="switchTab(this.value)" class="bg-slate-950 border border-slate-700 text-sm text-slate-300 rounded-lg px-2 py-1.5 focus:outline-none">
                                ${navItems.map(nav => `<option value="${nav.id}" ${state.currentTab === nav.id ? 'selected' : ''}>${nav.label}</option>`).join('')}
                            </select>
                            <button id="logoutBtnMobile" class="text-xs text-rose-400 border border-rose-900/50 bg-rose-950/30 px-3 py-1.5 rounded">Logout</button>
                        </header>

                        <!-- Scrollable View -->
                        <div class="flex-1 overflow-y-auto p-4 sm:p-8">
                            <div class="max-w-6xl mx-auto space-y-8 pb-20">
                                ${contentHTML}
                            </div>
                        </div>
                    </main>
                    ${modalHTML}
                </div>
            `;
        }

        function renderDashboardTab() {
            let ptsA = getTeamPoints('teamA');
            let ptsB = getTeamPoints('teamB');
            let leadA = ptsA >= ptsB ? 'border-pink-500 shadow-[0_0_15px_rgba(236,72,153,0.2)]' : 'border-slate-800';
            let leadB = ptsB >= ptsA ? 'border-indigo-500 shadow-[0_0_15px_rgba(99,102,241,0.2)]' : 'border-slate-800';

            return `
                <div class="mb-8">
                    <h1 class="text-3xl font-extrabold text-white tracking-tight">Live Dashboard</h1>
                    <p class="text-slate-400 mt-1">Real-time statistics and automated scoreboard.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <!-- Team A Score -->
                    <div class="bg-slate-900 border-2 ${leadA} p-6 rounded-2xl relative overflow-hidden transition-all">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-rose-500/10 rounded-full blur-2xl"></div>
                        <p class="text-sm font-bold text-rose-400 uppercase tracking-widest mb-1">Al-Shams</p>
                        <h2 class="text-5xl font-black text-white">${ptsA} <span class="text-lg text-slate-500 font-medium">pts</span></h2>
                    </div>
                    <!-- Team B Score -->
                    <div class="bg-slate-900 border-2 ${leadB} p-6 rounded-2xl relative overflow-hidden transition-all">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
                        <p class="text-sm font-bold text-indigo-400 uppercase tracking-widest mb-1">Al-Qamar</p>
                        <h2 class="text-5xl font-black text-white">${ptsB} <span class="text-lg text-slate-500 font-medium">pts</span></h2>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-slate-900/50 border border-slate-800 p-5 rounded-2xl">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Programmes</p>
                        <h3 class="text-2xl font-bold text-white mt-1">${state.programmes.length}</h3>
                    </div>
                    <div class="bg-slate-900/50 border border-slate-800 p-5 rounded-2xl">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Candidates</p>
                        <h3 class="text-2xl font-bold text-white mt-1">${state.candidates.length}</h3>
                    </div>
                    <div class="bg-slate-900/50 border border-slate-800 p-5 rounded-2xl">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Results Published</p>
                        <h3 class="text-2xl font-bold text-emerald-400 mt-1">${state.results.filter(r => r.published).length}</h3>
                    </div>
                </div>
            `;
        }

        function renderCandidatesTab() {
            let teamOptions = '';
            if (state.loggedInTeam === 'admin') {
                teamOptions = `<option value="teamA">Al-Shams (Team Alpha)</option><option value="teamB">Al-Qamar (Team Beta)</option>`;
            } else {
                teamOptions = `<option value="${state.loggedInTeam}">${state.teams[state.loggedInTeam].fullName}</option>`;
            }

            return `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                    <div>
                        <h1 class="text-3xl font-extrabold text-white tracking-tight">Candidates Directory</h1>
                        <p class="text-slate-400 mt-1">Manage participant registrations.</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- Registration Form -->
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 h-fit sticky top-0">
                        <h3 class="text-lg font-bold text-white border-b border-slate-800 pb-3 mb-4">👤 Add Candidate</h3>
                        <form id="candidateForm" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Full Name</label>
                                <input type="text" id="candName" required placeholder="e.g. Fathima Sana" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-pink-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Team Assignment</label>
                                <select id="candTeam" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-pink-500">
                                    ${teamOptions}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Category</label>
                                <select id="candCategory" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-pink-500">
                                    <option value="Junior">Junior</option>
                                    <option value="Senior">Senior</option>
                                    <option value="General">General</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Reg / Chest Number</label>
                                <input type="text" id="candRegNo" required placeholder="e.g. J104" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-pink-500">
                            </div>
                            <button type="submit" class="w-full py-2.5 bg-pink-600 hover:bg-pink-500 text-white font-semibold rounded-xl transition shadow-md mt-2">Register Candidate</button>
                        </form>
                    </div>

                    <!-- Candidates List -->
                    <div class="lg:col-span-2 space-y-3">
                        ${state.candidates.length === 0 ? `<p class="text-slate-500 italic p-4 bg-slate-900 rounded-xl text-center">No candidates registered yet.</p>` : ''}
                        ${state.candidates.slice().reverse().map(c => `
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-center justify-between hover:border-slate-700 transition">
                                <div class="flex items-center space-x-4">
                                    <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center font-bold text-slate-300 border border-slate-700">${c.regNo}</div>
                                    <div>
                                        <h4 class="font-bold text-white text-lg">${c.name}</h4>
                                        <p class="text-xs font-medium mt-0.5 ${c.team === 'teamA' ? 'text-rose-400' : 'text-indigo-400'}">${state.teams[c.team]?.name || c.team} • <span class="text-slate-400">${c.category}</span></p>
                                    </div>
                                </div>
                                ${state.loggedInTeam === 'admin' ? `<button onclick="deleteCandidate(${c.id})" class="text-rose-400 hover:text-rose-300 hover:bg-rose-950/50 p-2 rounded-lg transition" title="Delete Candidate">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProgrammesTab() {
            let adminForm = '';
            if (state.loggedInTeam === 'admin') {
                adminForm = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 mb-6">
                        <h3 class="text-md font-bold text-white mb-3">➕ Add Custom Programme</h3>
                        <form id="programmeForm" class="flex flex-wrap gap-3 items-end">
                            <div class="flex-1 min-w-[150px]">
                                <label class="block text-[10px] uppercase text-slate-400 mb-1">Programme Name</label>
                                <input type="text" id="progName" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm">
                            </div>
                            <div class="w-32">
                                <label class="block text-[10px] uppercase text-slate-400 mb-1">Code</label>
                                <input type="text" id="progCode" required placeholder="e.g. S22" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm">
                            </div>
                            <div class="w-32">
                                <label class="block text-[10px] uppercase text-slate-400 mb-1">Category</label>
                                <select id="progCat" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm">
                                    <option value="Junior">Junior</option>
                                    <option value="Senior">Senior</option>
                                    <option value="General">General</option>
                                </select>
                            </div>
                            <div class="w-32">
                                <label class="block text-[10px] uppercase text-slate-400 mb-1">Type</label>
                                <select id="progType" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white text-sm">
                                    <option value="stage">Stage</option>
                                    <option value="nonstage">Non-Stage</option>
                                </select>
                            </div>
                            <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold h-[38px]">Add</button>
                        </form>
                    </div>
                `;
            }

            return `
                <div class="mb-6">
                    <h1 class="text-3xl font-extrabold text-white tracking-tight">Fest Programmes</h1>
                    <p class="text-slate-400 mt-1">Complete list of events and competitions.</p>
                </div>
                ${adminForm}
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                    <div class="overflow-x-auto max-h-[600px]">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-950 text-slate-400 uppercase text-[10px] sticky top-0 z-10 shadow-md">
                                <tr>
                                    <th class="p-4 font-bold tracking-wider">Code</th>
                                    <th class="p-4 font-bold tracking-wider">Programme Name</th>
                                    <th class="p-4 font-bold tracking-wider">Category</th>
                                    <th class="p-4 font-bold tracking-wider">Type</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/50">
                                ${state.programmes.map(p => `
                                    <tr class="hover:bg-slate-800/30 transition">
                                        <td class="p-4 font-mono text-pink-400 font-semibold">${p.code}</td>
                                        <td class="p-4 font-medium text-white">${p.name}</td>
                                        <td class="p-4"><span class="px-2 py-1 rounded text-xs font-semibold ${p.category === 'Junior' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' : (p.category === 'Senior' ? 'bg-indigo-500/10 text-indigo-400 border border-indigo-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20')}">${p.category}</span></td>
                                        <td class="p-4 uppercase text-[10px] tracking-wider text-slate-400 font-bold">${p.type}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderResultsTab() {
            return `
                <div class="mb-6">
                    <h1 class="text-3xl font-extrabold text-white tracking-tight">Programme Results</h1>
                    <p class="text-slate-400 mt-1">Live tracking of points and winners.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                    ${state.programmes.map(p => {
                        let res = state.results.find(r => r.progId === p.id);
                        let isPublished = res && res.published;
                        
                        let cardContent = '';
                        if (isPublished) {
                            let firstCand = state.candidates.find(c => c.id == res.first);
                            let secondCand = state.candidates.find(c => c.id == res.second);
                            let thirdCand = state.candidates.find(c => c.id == res.third);
                            
                            cardContent = `
                                <div class="mt-3 space-y-2">
                                    ${firstCand ? `<div class="flex items-center text-sm"><span class="text-amber-400 mr-2">🥇 1st:</span> <span class="text-white truncate">${firstCand.name}</span> <span class="ml-auto text-xs text-slate-500">(${state.teams[firstCand.team].name})</span></div>` : ''}
                                    ${secondCand ? `<div class="flex items-center text-sm"><span class="text-slate-300 mr-2">🥈 2nd:</span> <span class="text-white truncate">${secondCand.name}</span> <span class="ml-auto text-xs text-slate-500">(${state.teams[secondCand.team].name})</span></div>` : ''}
                                    ${thirdCand ? `<div class="flex items-center text-sm"><span class="text-orange-400 mr-2">🥉 3rd:</span> <span class="text-white truncate">${thirdCand.name}</span> <span class="ml-auto text-xs text-slate-500">(${state.teams[thirdCand.team].name})</span></div>` : ''}
                                </div>
                            `;
                        } else {
                            cardContent = `<div class="mt-4 flex items-center justify-center p-3 border border-dashed border-slate-700 rounded-lg"><span class="text-xs text-slate-500 font-medium uppercase tracking-wider">Results Pending</span></div>`;
                        }

                        let actionBtn = state.loggedInTeam === 'admin' 
                            ? `<button onclick="openResultModal('${p.id}')" class="mt-4 w-full py-2 text-xs font-semibold rounded-lg border ${isPublished ? 'border-emerald-500/30 text-emerald-400 bg-emerald-950/20 hover:bg-emerald-900/40' : 'border-slate-700 text-slate-300 hover:bg-slate-800'} transition">
                                ${isPublished ? 'Edit Result' : 'Enter Result'}
                               </button>` 
                            : '';

                        return `
                            <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-pink-500/30 transition-colors flex flex-col">
                                <div class="flex justify-between items-start border-b border-slate-800/50 pb-3">
                                    <div>
                                        <h4 class="font-bold text-white leading-tight">${p.name}</h4>
                                        <p class="text-[10px] text-pink-400 font-mono mt-1">${p.code} • ${p.category}</p>
                                    </div>
                                    ${isPublished ? `<span class="bg-emerald-500/10 text-emerald-400 text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-wider border border-emerald-500/20">Published</span>` : ''}
                                </div>
                                <div class="flex-1 flex flex-col justify-between">
                                    ${cardContent}
                                    ${actionBtn}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function openResultModal(progId) {
            showResultModalFor = progId;
            render();
        }

        function closeResultModal() {
            showResultModalFor = null;
            render();
        }

        function renderResultModal() {
            let p = state.programmes.find(x => x.id === showResultModalFor);
            let res = state.results.find(r => r.progId === p.id) || { first: '', second: '', third: '' };
            
            // Filter candidates by category so admin doesn't assign a senior to junior oppana. General allows everyone.
            let eligibleCands = p.category === 'General' ? state.candidates : state.candidates.filter(c => c.category === p.category);
            let candOptions = `<option value="">-- Select Candidate --</option>` + 
                eligibleCands.map(c => `<option value="${c.id}">${c.name} (${c.regNo}) - ${state.teams[c.team].name}</option>`).join('');

            return `
                <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
                        <button onclick="closeResultModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                        <h3 class="text-xl font-bold text-white mb-1">Enter Results</h3>
                        <p class="text-sm text-pink-400 font-semibold mb-5">${p.name} (${p.category})</p>
                        
                        <form id="resultForm" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-amber-400 uppercase mb-1">🥇 First Place (5 Pts)</label>
                                <select id="resFirst" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                                    ${candOptions.replace(`value="${res.first}"`, `value="${res.first}" selected`)}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-300 uppercase mb-1">🥈 Second Place (3 Pts)</label>
                                <select id="resSecond" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                                    ${candOptions.replace(`value="${res.second}"`, `value="${res.second}" selected`)}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-orange-400 uppercase mb-1">🥉 Third Place (1 Pt)</label>
                                <select id="resThird" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm">
                                    ${candOptions.replace(`value="${res.third}"`, `value="${res.third}" selected`)}
                                </select>
                            </div>
                            
                            <div class="pt-4 flex space-x-3 border-t border-slate-800 mt-4">
                                <button type="button" onclick="closeResultModal()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl transition">Cancel</button>
                                <button type="submit" class="flex-1 py-2 bg-pink-600 hover:bg-pink-500 text-white font-semibold rounded-xl transition shadow-md">Publish Result</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function attachEventListeners() {
            const loginForm = document.getElementById('loginForm');
            if (loginForm) loginForm.onsubmit = handleLogin;

            const logoutBtn = document.getElementById('logoutBtn');
            if (logoutBtn) logoutBtn.onclick = handleLogout;
            
            const logoutBtnMobile = document.getElementById('logoutBtnMobile');
            if (logoutBtnMobile) logoutBtnMobile.onclick = handleLogout;

            const candidateForm = document.getElementById('candidateForm');
            if (candidateForm) candidateForm.onsubmit = handleCandidateSubmit;

            const programmeForm = document.getElementById('programmeForm');
            if (programmeForm) programmeForm.onsubmit = handleProgrammeSubmit;

            const resultForm = document.getElementById('resultForm');
            if (resultForm) resultForm.onsubmit = handleResultSubmit;
        }

        function handleLogin(e) {
            e.preventDefault();
            const teamKey = document.getElementById('loginTeam').value;
            const pass = document.getElementById('loginPass').value;

            let valid = false;
            if (teamKey === 'admin' && pass === 'admin26') valid = true;
            else if (state.teams[teamKey] && pass === state.teams[teamKey].pass) valid = true;

            if (valid) {
                state.loggedInTeam = teamKey;
                saveState();
                showToast("Login successful!");
                render();
            } else {
                showToast("Invalid password!");
            }
        }

        function handleLogout() {
            state.loggedInTeam = null;
            state.currentTab = 'dashboard';
            saveState();
            showToast("Logged out successfully.");
            render();
        }

        function handleCandidateSubmit(e) {
            e.preventDefault();
            const newCand = {
                id: Date.now(),
                name: document.getElementById('candName').value,
                team: document.getElementById('candTeam').value,
                category: document.getElementById('candCategory').value,
                regNo: document.getElementById('candRegNo').value
            };
            state.candidates.push(newCand);
            saveState();
            showToast("Candidate registered!");
            render();
        }

        function deleteCandidate(id) {
            if(confirm("Are you sure you want to remove this candidate?")) {
                state.candidates = state.candidates.filter(c => c.id !== id);
                saveState();
                showToast("Candidate deleted.");
                render();
            }
        }

        function handleProgrammeSubmit(e) {
            e.preventDefault();
            const newProg = {
                id: 'P' + Date.now(),
                name: document.getElementById('progName').value,
                code: document.getElementById('progCode').value,
                category: document.getElementById('progCat').value,
                type: document.getElementById('progType').value
            };
            state.programmes.push(newProg);
            saveState();
            showToast("Programme added!");
            render();
        }

        function handleResultSubmit(e) {
            e.preventDefault();
            const first = document.getElementById('resFirst').value;
            const second = document.getElementById('resSecond').value;
            const third = document.getElementById('resThird').value;

            let existingIdx = state.results.findIndex(r => r.progId === showResultModalFor);
            let resultData = { progId: showResultModalFor, first, second, third, published: true };

            if (existingIdx >= 0) {
                state.results[existingIdx] = resultData;
            } else {
                state.results.push(resultData);
            }

            saveState();
            showResultModalFor = null;
            showToast("Results Published! Scores updated.");
            render();
        }

        window.onload = render;
    </script>
</body>
</html>
