<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Fest 2026 - Live Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .tab-active { border-bottom: 2px solid #ec4899; color: #ec4899; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #94a3b8; }
    </style>
</head>
<body>

    <!-- Error Catcher: Prevents Black Screen -->
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            document.body.innerHTML = `
                <div style="padding: 40px; text-align: center; color: #ef4444; font-family: sans-serif;">
                    <h1 style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">⚠️ Application Error</h1>
                    <p style="margin-bottom: 10px;">The app crashed. Please show this error to the developer:</p>
                    <code style="background: #450a0a; padding: 15px; border-radius: 8px; display: inline-block; text-align: left;">
                        ${msg}<br>Line: ${lineNo}
                    </code>
                </div>`;
            return false;
        };
    </script>

    <div id="toast" class="fixed top-5 right-5 z-[100] transform translate-y-[-200%] transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm">
        <span id="toastIcon"></span>
        <span id="toastMsg"></span>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-black/80 z-[200] items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <div class="text-4xl mb-4">⚠️</div>
            <h3 class="text-lg font-bold text-white mb-2">Are you sure?</h3>
            <p id="confirmText" class="text-sm text-slate-400 mb-6"></p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeConfirm()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold transition">Cancel</button>
                <button onclick="executeConfirm()" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white rounded-lg text-sm font-semibold transition">Yes, Proceed</button>
            </div>
        </div>
    </div>

    <div id="app" class="min-h-screen flex flex-col"></div>

    <script>
        // --- DATA & CONFIGURATION ---
        const STORAGE_KEY = "aura_fest_data_v4";
        
        const TEAMS = {
            admin: { id: 'admin', name: 'Main Admin', pass: 'admin26' },
            teamA: { id: 'teamA', name: 'Al-Shams', pass: 'shams26', color: 'text-rose-400' },
            teamB: { id: 'teamB', name: 'Al-Qamar', pass: 'qamar26', color: 'text-indigo-400' }
        };

        const PROGRAMS = [
            // Junior Stage
            { id: 'p1', name: 'ഖിറാഅത്ത്', cat: 'Junior', type: 'Stage' },
            { id: 'p2', name: 'സിംഗിൾ സോങ് (മദ്ഹ്)', cat: 'Junior', type: 'Stage' },
            { id: 'p3', name: 'കഥ പറച്ചിൽ', cat: 'Junior', type: 'Stage' },
            // Junior Non-Stage
            { id: 'p4', name: 'പെൻസിൽ ഡ്രോയിംഗ്', cat: 'Junior', type: 'Non-Stage' },
            { id: 'p5', name: 'പെയിന്റിംഗ്', cat: 'Junior', type: 'Non-Stage' },
            { id: 'p6', name: 'മെമ്മറി ടെസ്റ്റ്', cat: 'Junior', type: 'Non-Stage' },
            { id: 'p7', name: 'ചിത്രരചന', cat: 'Junior', type: 'Non-Stage' },
            { id: 'p8', name: 'എഴുത്ത് മത്സരം', cat: 'Junior', type: 'Non-Stage' },
            { id: 'p9', name: 'ഗ്രന്ഥവായന', cat: 'Junior', type: 'Non-Stage' },
            // Senior Stage
            { id: 'p10', name: 'മദ്ഹ് സോങ്', cat: 'Senior', type: 'Stage' },
            { id: 'p11', name: 'ഖിറാഅത്ത്', cat: 'Senior', type: 'Stage' },
            { id: 'p12', name: 'പ്രസംഗം (മലയാളം)', cat: 'Senior', type: 'Stage' },
            { id: 'p13', name: 'പ്രസംഗം (ഇംഗ്ലീഷ്)', cat: 'Senior', type: 'Stage' },
            { id: 'p14', name: 'തത്സമയ കവിതാരചന', cat: 'Senior', type: 'Stage' },
            // Senior Non-Stage
            { id: 'p15', name: 'കയ്യെഴുത്ത്', cat: 'Senior', type: 'Non-Stage' },
            { id: 'p16', name: 'പദപയറ്റ്', cat: 'Senior', type: 'Non-Stage' },
            { id: 'p17', name: 'സ്പെല്ലിംഗ് ബി', cat: 'Senior', type: 'Non-Stage' },
            { id: 'p18', name: 'കാലിഗ്രാഫി', cat: 'Senior', type: 'Non-Stage' },
            { id: 'p19', name: 'നാനോ ലിറ്ററേച്ചർ', cat: 'Senior', type: 'Non-Stage' },
            { id: 'p20', name: 'ഗ്രന്ഥവായന', cat: 'Senior', type: 'Non-Stage' },
            { id: 'p21', name: 'അടിക്കുറിപ്പ് നിർമ്മാണം', cat: 'Senior', type: 'Non-Stage' },
            { id: 'p22', name: 'തലക്കെട്ട് നിർമ്മാണം', cat: 'Senior', type: 'Non-Stage' },
            // General Stage
            { id: 'p23', name: 'ബുർദ', cat: 'General', type: 'Stage' },
            { id: 'p24', name: 'മാലപ്പാട്ട്', cat: 'General', type: 'Stage' },
            { id: 'p25', name: 'ഗ്രൂപ്പ് സോങ്', cat: 'General', type: 'Stage' },
            // General Non-Stage
            { id: 'p26', name: 'ക്വിസ്', cat: 'General', type: 'Non-Stage' },
            { id: 'p27', name: 'മെമ്മറി ടെസ്റ്റ്', cat: 'General', type: 'Non-Stage' },
            { id: 'p28', name: 'മാഗസിൻ നിർമ്മാണം', cat: 'General', type: 'Non-Stage' },
            { id: 'p29', name: 'കൊളാഷ്', cat: 'General', type: 'Non-Stage' },
            { id: 'p30', name: 'പത്രനിർമ്മാണം', cat: 'General', type: 'Non-Stage' }
        ];

        // --- STATE MANAGEMENT ---
        let defaultState = {
            role: null,
            tab: 'dashboard',
            candidates: [],
            results: []
        };

        let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState;
        let pendingAction = null;

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        // --- UTILITIES ---
        window.showAlert = (msg, type = 'success') => {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').innerText = type === 'error' ? '⚠️' : '✨';
            
            if (type === 'error') {
                toast.className = "fixed top-5 right-5 z-[100] transform transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm bg-red-950/90 border border-red-500/50 text-red-200 translate-y-0";
            } else {
                toast.className = "fixed top-5 right-5 z-[100] transform transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm bg-emerald-950/90 border border-emerald-500/50 text-emerald-200 translate-y-0";
            }

            setTimeout(() => {
                toast.classList.add('translate-y-[-200%]');
                toast.classList.remove('translate-y-0');
            }, 3000);
        };

        window.openConfirm = (msg, callback) => {
            document.getElementById('confirmText').innerText = msg;
            document.getElementById('confirmModal').classList.remove('hidden');
            document.getElementById('confirmModal').classList.add('flex');
            pendingAction = callback;
        };

        window.closeConfirm = () => {
            document.getElementById('confirmModal').classList.add('hidden');
            document.getElementById('confirmModal').classList.remove('flex');
            pendingAction = null;
        };

        window.executeConfirm = () => {
            if (pendingAction) pendingAction();
            closeConfirm();
        };

        // --- SCORING LOGIC (10 - 5 - 3) ---
        function getScores() {
            let scores = { teamA: 0, teamB: 0 };
            state.results.forEach(res => {
                const c1 = state.candidates.find(c => c.id === res.first);
                const c2 = state.candidates.find(c => c.id === res.second);
                const c3 = state.candidates.find(c => c.id === res.third);

                if (c1 && scores[c1.team] !== undefined) scores[c1.team] += 10;
                if (c2 && scores[c2.team] !== undefined) scores[c2.team] += 5;
                if (c3 && scores[c3.team] !== undefined) scores[c3.team] += 3;
            });
            return scores;
        }

        // --- CORE FUNCTIONS ---
        window.handleLogin = (e) => {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            const pass = document.getElementById('loginPass').value;
            
            if (TEAMS[role] && TEAMS[role].pass === pass) {
                state.role = role;
                state.tab = 'dashboard';
                saveState();
                showAlert("Logged in successfully!");
                render();
            } else {
                showAlert("Invalid Password!", "error");
            }
        };

        window.handleLogout = () => {
            state.role = null;
            saveState();
            render();
        };

        window.switchTab = (tab) => {
            state.tab = tab;
            saveState();
            render();
        };

        window.addCandidate = (e) => {
            e.preventDefault();
            const name = document.getElementById('cName').value;
            const regNo = document.getElementById('cReg').value;
            const cat = document.getElementById('cCat').value;
            const team = state.role === 'admin' ? document.getElementById('cTeam').value : state.role;

            state.candidates.push({ id: Date.now().toString(), name, regNo, cat, team });
            saveState();
            showAlert("Candidate Registered!");
            render();
        };

        window.deleteCandidate = (id) => {
            openConfirm("Delete this candidate?", () => {
                state.candidates = state.candidates.filter(c => c.id !== id);
                saveState();
                showAlert("Candidate deleted.");
                render();
            });
        };

        // Dynamic Dropdowns for Results
        window.populateResultDropdowns = () => {
            const progId = document.getElementById('rProg').value;
            const prog = PROGRAMS.find(p => p.id === progId);
            const container = document.getElementById('rSelectors');
            
            if (!prog) {
                container.innerHTML = '';
                return;
            }

            // Filter eligible candidates (General programs allow Junior and Senior)
            const eligibleCands = state.candidates.filter(c => 
                prog.cat === 'General' ? true : c.cat === prog.cat
            );

            let optionsHtml = `<option value="">-- Select Winner --</option>`;
            eligibleCands.forEach(c => {
                optionsHtml += `<option value="${c.id}">${c.regNo} - ${c.name} (${TEAMS[c.team].name})</option>`;
            });

            container.innerHTML = `
                <div class="mt-4 space-y-3 p-4 bg-slate-950 rounded-xl border border-slate-800">
                    <div>
                        <label class="block text-xs font-bold text-yellow-500 mb-1">1st Place (10 Pts)</label>
                        <select id="rFirst" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">${optionsHtml}</select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">2nd Place (5 Pts)</label>
                        <select id="rSecond" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">${optionsHtml}</select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-amber-700 mb-1">3rd Place (3 Pts)</label>
                        <select id="rThird" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">${optionsHtml}</select>
                    </div>
                </div>
                <button type="submit" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition">Publish Result</button>
            `;
        };

        window.publishResult = (e) => {
            e.preventDefault();
            const progId = document.getElementById('rProg').value;
            const first = document.getElementById('rFirst').value;
            const second = document.getElementById('rSecond').value;
            const third = document.getElementById('rThird').value;

            if (!first) return showAlert("1st place is mandatory!", "error");

            const newResult = { progId, first, second, third };
            const existingIdx = state.results.findIndex(r => r.progId === progId);

            if (existingIdx >= 0) {
                openConfirm("Results for this program already exist. Overwrite them?", () => {
                    state.results[existingIdx] = newResult;
                    saveState();
                    showAlert("Results Overwritten!");
                    render();
                });
            } else {
                state.results.push(newResult);
                saveState();
                showAlert("Results Published!");
                render();
            }
        };


        // --- RENDERING VIEWS ---
        function render() {
            const app = document.getElementById('app');
            if (!state.role) {
                app.innerHTML = renderLogin();
            } else {
                app.innerHTML = renderApp();
            }
        }

        function renderLogin() {
            return `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                        <div class="text-center mb-8">
                            <h1 class="text-3xl font-extrabold text-white mb-2">Aura Fest</h1>
                            <p class="text-sm text-slate-400">Secure Organizer Login</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Account Role</label>
                                <select id="loginRole" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none">
                                    <option value="admin">Admin</option>
                                    <option value="teamA">Team Al-Shams</option>
                                    <option value="teamB">Team Al-Qamar</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">Password</label>
                                <input type="password" id="loginPass" required class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none" placeholder="Enter password">
                            </div>
                            <button type="submit" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-bold py-3.5 rounded-xl transition mt-2">Login</button>
                        </form>
                    </div>
                </div>`;
        }

        function renderApp() {
            const scores = getScores();
            
            let navHtml = `
                <nav class="flex overflow-x-auto border-b border-slate-800 bg-slate-900/50 px-4">
                    <button onclick="switchTab('dashboard')" class="px-6 py-4 font-semibold text-sm ${state.tab==='dashboard'?'tab-active':'tab-inactive'}">Dashboard</button>
                    <button onclick="switchTab('candidates')" class="px-6 py-4 font-semibold text-sm ${state.tab==='candidates'?'tab-active':'tab-inactive'}">Candidates</button>
                    <button onclick="switchTab('programs')" class="px-6 py-4 font-semibold text-sm ${state.tab==='programs'?'tab-active':'tab-inactive'}">Programs</button>
                    <button onclick="switchTab('results')" class="px-6 py-4 font-semibold text-sm ${state.tab==='results'?'tab-active':'tab-inactive'}">Results</button>
                </nav>`;

            let mainContent = '';

            if (state.tab === 'dashboard') {
                mainContent = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-slate-900 border border-rose-500/30 rounded-2xl p-8 text-center">
                            <h3 class="text-xl font-bold text-rose-400 mb-2">Al-Shams</h3>
                            <span class="text-7xl font-black text-white">${scores.teamA}</span>
                            <p class="text-slate-400 mt-2 text-xs uppercase font-bold tracking-widest">Total Points</p>
                        </div>
                        <div class="bg-slate-900 border border-indigo-500/30 rounded-2xl p-8 text-center">
                            <h3 class="text-xl font-bold text-indigo-400 mb-2">Al-Qamar</h3>
                            <span class="text-7xl font-black text-white">${scores.teamB}</span>
                            <p class="text-slate-400 mt-2 text-xs uppercase font-bold tracking-widest">Total Points</p>
                        </div>
                    </div>`;
            }

            if (state.tab === 'candidates') {
                mainContent = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-1 bg-slate-900 border border-slate-800 p-6 rounded-2xl h-fit">
                            <h3 class="font-bold text-white mb-4">Register Candidate</h3>
                            <form onsubmit="addCandidate(event)" class="space-y-4">
                                <input type="text" id="cName" required placeholder="Full Name" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none">
                                <input type="text" id="cReg" required placeholder="Chest / Reg No" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none">
                                <select id="cCat" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none">
                                    <option value="Junior">Junior</option><option value="Senior">Senior</option>
                                </select>
                                ${state.role === 'admin' ? 
                                    `<select id="cTeam" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none">
                                        <option value="teamA">Al-Shams</option><option value="teamB">Al-Qamar</option>
                                    </select>` : ''}
                                <button type="submit" class="w-full bg-pink-600 text-white font-bold py-2 rounded-lg">Save Candidate</button>
                            </form>
                        </div>
                        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 p-6 rounded-2xl">
                            <h3 class="font-bold text-white mb-4">Database (${state.candidates.length})</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-sm whitespace-nowrap">
                                    <thead class="bg-slate-950 text-slate-400 text-xs uppercase">
                                        <tr><th class="p-3">Reg No</th><th class="p-3">Name</th><th class="p-3">Cat</th><th class="p-3">Team</th><th class="p-3">Action</th></tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-800">
                                        ${state.candidates.map(c => `
                                            <tr>
                                                <td class="p-3 text-pink-400 font-mono">${c.regNo}</td>
                                                <td class="p-3 text-white">${c.name}</td>
                                                <td class="p-3 text-slate-300">${c.cat}</td>
                                                <td class="p-3 ${TEAMS[c.team].color} font-bold">${TEAMS[c.team].name}</td>
                                                <td class="p-3">
                                                    ${state.role === 'admin' ? `<button onclick="deleteCandidate('${c.id}')" class="text-red-400 text-xs border border-red-500/30 px-2 py-1 rounded">Delete</button>` : '-'}
                                                </td>
                                            </tr>`).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>`;
            }

            if (state.tab === 'programs') {
                const cats = ['Junior', 'Senior', 'General'];
                mainContent = `<div class="grid grid-cols-1 md:grid-cols-3 gap-6">`;
                cats.forEach(cat => {
                    mainContent += `<div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                        <h3 class="font-bold text-lg mb-3 text-white border-b border-slate-800 pb-2">${cat} Programs</h3>
                        <ul class="space-y-2">`;
                    PROGRAMS.filter(p => p.cat === cat).forEach(p => {
                        const hasResult = state.results.some(r => r.progId === p.id);
                        mainContent += `<li class="text-sm bg-slate-950 p-2 rounded-lg border border-slate-800 flex justify-between text-slate-300">
                            <span>${p.name} <span class="text-[10px] text-slate-500 uppercase ml-1">(${p.type})</span></span>
                            ${hasResult ? '✅' : ''}
                        </li>`;
                    });
                    mainContent += `</ul></div>`;
                });
                mainContent += `</div>`;
            }

            if (state.tab === 'results') {
                mainContent = `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        ${state.role === 'admin' ? `
                            <div class="bg-slate-900 border border-emerald-500/30 p-6 rounded-2xl h-fit">
                                <h3 class="font-bold text-emerald-400 mb-4 text-lg">Publish Result</h3>
                                <form onsubmit="publishResult(event)">
                                    <select id="rProg" onchange="populateResultDropdowns()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-white outline-none">
                                        <option value="">-- Select Program --</option>
                                        ${PROGRAMS.map(p => `<option value="${p.id}">${p.name} (${p.cat})</option>`).join('')}
                                    </select>
                                    <div id="rSelectors"></div>
                                </form>
                            </div>
                        ` : `
                            <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex items-center justify-center text-slate-400">
                                Only Admin can publish results.
                            </div>
                        `}
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl h-fit max-h-[600px] overflow-y-auto">
                            <h3 class="font-bold text-white mb-4 text-lg">Published Results</h3>
                            <div class="space-y-3">
                                ${state.results.length === 0 ? '<p class="text-slate-500">No results yet.</p>' : ''}
                                ${state.results.map(res => {
                                    const prog = PROGRAMS.find(p => p.id === res.progId);
                                    const c1 = state.candidates.find(c => c.id === res.first);
                                    const c2 = state.candidates.find(c => c.id === res.second);
                                    const c3 = state.candidates.find(c => c.id === res.third);
                                    return `
                                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl">
                                            <h4 class="font-bold text-white mb-2">${prog?.name} <span class="text-xs text-slate-500 font-normal">(${prog?.cat})</span></h4>
                                            <div class="text-sm space-y-1">
                                                ${c1 ? `<p class="text-yellow-500">1st (10pts): ${c1.name} <span class="text-xs text-slate-500">(${TEAMS[c1.team].name})</span></p>` : ''}
                                                ${c2 ? `<p class="text-slate-400">2nd (5pts): ${c2.name} <span class="text-xs text-slate-500">(${TEAMS[c2.team].name})</span></p>` : ''}
                                                ${c3 ? `<p class="text-amber-700">3rd (3pts): ${c3.name} <span class="text-xs text-slate-500">(${TEAMS[c3.team].name})</span></p>` : ''}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>`;
            }

            return `
                <header class="bg-slate-900 border-b border-slate-800 p-4 px-6 flex justify-between items-center sticky top-0 z-50">
                    <div>
                        <h1 class="font-bold text-white text-lg">Aura Fest '26</h1>
                        <p class="text-xs text-slate-400">Logged in: <span class="font-bold text-white">${TEAMS[state.role].name}</span></p>
                    </div>
                    <button onclick="handleLogout()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold transition">Logout</button>
                </header>
                ${navHtml}
                <main class="flex-1 p-6 max-w-7xl w-full mx-auto">
                    ${mainContent}
                </main>`;
        }

        // --- STARTUP ---
        window.onload = render;
    </script>
</body>
</html>
