<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Fest 2026 - Premium Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .tab-active { border-bottom: 2px solid #ec4899; color: #ec4899; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #94a3b8; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .tv-glow { filter: drop-shadow(0 0 25px rgba(255,255,255,0.2)); }
    </style>
</head>
<body>

    <!-- UI Overlays -->
    <div id="toast" class="fixed top-5 right-5 z-[100] transform translate-y-[-200%] transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm">
        <span id="toastIcon"></span>
        <span id="toastMsg"></span>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" style="display: none;" class="fixed inset-0 bg-black/80 z-[200] items-center justify-center p-4 backdrop-blur-md">
        <div class="glass-card p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <div class="text-4xl mb-4">⚠️</div>
            <h3 class="text-lg font-bold text-white mb-2">Are you sure?</h3>
            <p id="confirmText" class="text-sm text-slate-400 mb-6"></p>
            <div class="flex gap-3 justify-center">
                <button onclick="closeConfirm()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold transition border border-slate-600">Cancel</button>
                <button onclick="executeConfirm()" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white rounded-lg text-sm font-semibold transition shadow-lg shadow-pink-900/50">Yes, Proceed</button>
            </div>
        </div>
    </div>

    <!-- Edit Prompt Modal -->
    <div id="promptModal" style="display: none;" class="fixed inset-0 bg-black/80 z-[200] items-center justify-center p-4 backdrop-blur-md">
        <div class="glass-card p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <h3 id="promptTitle" class="text-lg font-bold text-white mb-4"></h3>
            <input type="text" id="promptInput" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 text-white outline-none focus:border-pink-500 mb-6">
            <div class="flex gap-3 justify-center">
                <button onclick="closePrompt()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold transition border border-slate-600">Cancel</button>
                <button onclick="executePrompt()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-semibold transition shadow-lg shadow-emerald-900/50">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Assign Events Modal -->
    <div id="assignModal" style="display: none;" class="fixed inset-0 bg-black/80 z-[200] items-center justify-center p-4 backdrop-blur-md">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl flex flex-col max-h-[85vh]">
            <h3 class="text-lg font-bold text-white mb-1" id="assignTitle">Assign Events</h3>
            <p class="text-xs text-pink-400 mb-1 font-bold tracking-widest uppercase" id="assignSubtitle"></p>
            <p class="text-[10px] text-slate-400 mb-4 bg-slate-900/50 p-2 rounded border border-slate-800">⚠️ Max Limits: <strong class="text-pink-400">3 Stage</strong> & <strong class="text-indigo-400">5 Non-Stage</strong> per candidate. <br><span class="text-emerald-400 font-bold">(General Events are UNLIMITED)</span></p>
            <div class="bg-slate-950/50 border border-slate-800 rounded-xl p-4 flex-1 overflow-y-auto mb-4 custom-scrollbar">
                <div id="assignCheckboxes" class="space-y-3"></div>
            </div>
            <div class="flex gap-3 justify-end pt-2">
                <button onclick="closeAssign()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold transition border border-slate-600">Cancel</button>
                <button id="saveAssignBtn" onclick="saveAssign()" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white rounded-lg text-sm font-semibold transition shadow-lg shadow-pink-900/50">Save Assignments</button>
            </div>
        </div>
    </div>

    <!-- View Enrolled Modal -->
    <div id="enrolledModal" style="display: none;" class="fixed inset-0 bg-black/80 z-[200] items-center justify-center p-4 backdrop-blur-md">
        <div class="glass-card p-6 rounded-2xl max-w-md w-full shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-1">
                <h3 class="text-lg font-bold text-white" id="enrolledTitle">Registered Participants</h3>
                <button onclick="closeEnrolled()" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-full w-8 h-8 flex items-center justify-center transition">✕</button>
            </div>
            <p class="text-xs text-indigo-400 mb-4 font-bold tracking-widest uppercase" id="enrolledSubtitle"></p>
            <div class="bg-slate-950/50 border border-slate-800 rounded-xl p-4 flex-1 overflow-y-auto custom-scrollbar">
                <div id="enrolledList" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- App Container -->
    <div id="app" class="min-h-screen flex flex-col"></div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCIbvk4teIJ6AlfaXbFgDMgCWpnekNwmx8",
            authDomain: "pullani-6a39b.firebaseapp.com",
            projectId: "pullani-6a39b",
            storageBucket: "pullani-6a39b.firebasestorage.app",
            messagingSenderId: "617480764841",
            appId: "1:617480764841:web:c22959689a7003a31498b8",
            measurementId: "G-DX50SRTWJS"
        };
        
        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);

        // --- DEFAULT DATA ---
        const DEFAULT_TEAMS = {
            admin: { id: 'admin', name: 'Main Admin', pass: 'admin26' },
            teamA: { id: 'teamA', name: 'Al-Shams', pass: 'shams26', color: 'text-rose-400' },
            teamB: { id: 'teamB', name: 'Al-Qamar', pass: 'qamar26', color: 'text-indigo-400' }
        };

        const DEFAULT_PROGRAMS = [
            { id: 'p1', name: 'ഖിറാഅത്ത്', cat: 'Junior', type: 'Stage', isGroup: false },
            { id: 'p2', name: 'സിംഗിൾ സോങ് (മദ്ഹ്)', cat: 'Junior', type: 'Stage', isGroup: false },
            { id: 'p3', name: 'കഥ പറച്ചിൽ', cat: 'Junior', type: 'Stage', isGroup: false },
            { id: 'p4', name: 'പെൻസിൽ ഡ്രോയിംഗ്', cat: 'Junior', type: 'Non-Stage', isGroup: false },
            { id: 'p5', name: 'പെയിന്റിംഗ്', cat: 'Junior', type: 'Non-Stage', isGroup: false },
            { id: 'p6', name: 'മെമ്മറി ടെസ്റ്റ്', cat: 'Junior', type: 'Non-Stage', isGroup: false },
            { id: 'p7', name: 'ചിത്രരചന', cat: 'Junior', type: 'Non-Stage', isGroup: false },
            { id: 'p8', name: 'എഴുത്ത് മത്സരം', cat: 'Junior', type: 'Non-Stage', isGroup: false },
            { id: 'p9', name: 'ഗ്രന്ഥവായന', cat: 'Junior', type: 'Non-Stage', isGroup: false },
            { id: 'p10', name: 'മദ്ഹ് സോങ്', cat: 'Senior', type: 'Stage', isGroup: false },
            { id: 'p11', name: 'ഖിറാഅത്ത്', cat: 'Senior', type: 'Stage', isGroup: false },
            { id: 'p12', name: 'പ്രസംഗം (മലയാളം)', cat: 'Senior', type: 'Stage', isGroup: false },
            { id: 'p13', name: 'പ്രസംഗം (ഇംഗ്ലീഷ്)', cat: 'Senior', type: 'Stage', isGroup: false },
            { id: 'p14', name: 'തത്സമയ കവിതാരചന', cat: 'Senior', type: 'Stage', isGroup: false },
            { id: 'p15', name: 'കയ്യെഴുത്ത്', cat: 'Senior', type: 'Non-Stage', isGroup: false },
            { id: 'p16', name: 'പദപയറ്റ്', cat: 'Senior', type: 'Non-Stage', isGroup: false },
            { id: 'p17', name: 'സ്പെല്ലിംഗ് ബി', cat: 'Senior', type: 'Non-Stage', isGroup: false },
            { id: 'p18', name: 'കാലിഗ്രാഫി', cat: 'Senior', type: 'Non-Stage', isGroup: false },
            { id: 'p19', name: 'നാനോ ലിറ്ററേച്ചർ', cat: 'Senior', type: 'Non-Stage', isGroup: false },
            { id: 'p20', name: 'ഗ്രന്ഥവായന', cat: 'Senior', type: 'Non-Stage', isGroup: false },
            { id: 'p21', name: 'അടിക്കുറിപ്പ് നിർമ്മാണം', cat: 'Senior', type: 'Non-Stage', isGroup: false },
            { id: 'p22', name: 'തലക്കെട്ട് നിർമ്മാണം', cat: 'Senior', type: 'Non-Stage', isGroup: false },
            { id: 'p23', name: 'ബുർദ', cat: 'General', type: 'Stage', isGroup: true },
            { id: 'p24', name: 'മാലപ്പാട്ട്', cat: 'General', type: 'Stage', isGroup: true },
            { id: 'p25', name: 'ഗ്രൂപ്പ് സോങ്', cat: 'General', type: 'Stage', isGroup: true },
            { id: 'p26', name: 'ക്വിസ്', cat: 'General', type: 'Non-Stage', isGroup: true },
            { id: 'p27', name: 'മെമ്മറി ടെസ്റ്റ്', cat: 'General', type: 'Non-Stage', isGroup: false },
            { id: 'p28', name: 'മാഗസിൻ നിർമ്മാണം', cat: 'General', type: 'Non-Stage', isGroup: true },
            { id: 'p29', name: 'കൊളാഷ്', cat: 'General', type: 'Non-Stage', isGroup: true },
            { id: 'p30', name: 'പത്രനിർമ്മാണം', cat: 'General', type: 'Non-Stage', isGroup: true }
        ];

        let state = {
            user: null,
            role: sessionStorage.getItem('aura_role') || null, 
            tab: 'dashboard',
            candidates: [],
            results: [],
            teams: DEFAULT_TEAMS,
            programs: DEFAULT_PROGRAMS,
            showChampions: false,
            dbReady: false,
            tvMode: false
        };

        const initDB = async () => {
            try { 
                await signInAnonymously(auth); 
            } catch (e) { 
                window.showAlert("Database Connection Failed. Check Firebase Auth.", "error");
            }
        };

        onAuthStateChanged(auth, (user) => {
            state.user = user;
            if (user) {
                const configRef = doc(db, 'settings', 'config');
                onSnapshot(configRef, (snap) => {
                    if (snap.exists()) {
                        const data = snap.data();
                        state.teams = data.teams || DEFAULT_TEAMS;
                        state.programs = data.programs || DEFAULT_PROGRAMS;
                        state.showChampions = data.showChampions || false;
                    } else {
                        setDoc(configRef, { teams: DEFAULT_TEAMS, programs: DEFAULT_PROGRAMS, showChampions: false });
                    }
                    render();
                });

                const candRef = collection(db, 'candidates');
                onSnapshot(candRef, (snap) => {
                    state.candidates = snap.docs.map(d => ({ 
                        id: d.id, 
                        assignedPrograms: [], 
                        ...d.data() 
                    }));
                    state.dbReady = true;
                    render();
                });

                const resRef = collection(db, 'results');
                onSnapshot(resRef, (snap) => {
                    state.results = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    render();
                });
            }
        });

        initDB(); 
        window.onload = render; 

        // --- ALERTS & MODALS ---
        window.showAlert = (msg, type = 'success') => {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').innerText = type === 'error' ? '⚠️' : '✨';
            toast.className = `fixed top-5 right-5 z-[100] transform transition-transform duration-300 px-6 py-3 rounded-xl shadow-2xl font-semibold flex items-center space-x-3 text-sm translate-y-0 ${type === 'error' ? 'bg-red-950/90 border border-red-500/50 text-red-200' : 'bg-emerald-950/90 border border-emerald-500/50 text-emerald-200'}`;
            setTimeout(() => { toast.classList.add('translate-y-[-200%]'); toast.classList.remove('translate-y-0'); }, 4000); 
        };

        let pendingAction = null;
        window.openConfirm = (msg, callback) => {
            document.getElementById('confirmText').innerText = msg;
            document.getElementById('confirmModal').style.display = 'flex';
            pendingAction = callback;
        };
        window.closeConfirm = () => {
            document.getElementById('confirmModal').style.display = 'none';
            pendingAction = null;
        };
        window.executeConfirm = () => {
            if (pendingAction) pendingAction();
            closeConfirm();
        };

        let promptAction = null;
        window.openPrompt = (title, defaultValue, callback) => {
            document.getElementById('promptTitle').innerText = title;
            document.getElementById('promptInput').value = defaultValue;
            document.getElementById('promptModal').style.display = 'flex';
            promptAction = callback;
            document.getElementById('promptInput').focus();
        };
        window.closePrompt = () => {
            document.getElementById('promptModal').style.display = 'none';
            promptAction = null;
        };
        window.executePrompt = () => {
            if (promptAction) {
                const val = document.getElementById('promptInput').value.trim();
                promptAction(val);
            }
            closePrompt();
        };

        // --- MODAL LOGIC ---
        let currentAssignCandidateId = null;
        window.openAssign = (candId) => {
            const candidate = state.candidates.find(c => c.id === candId);
            if (!candidate) return;
            currentAssignCandidateId = candId;

            document.getElementById('assignTitle').innerText = `Assign Events`;
            document.getElementById('assignSubtitle').innerText = `${candidate.name} • ${candidate.cat}`;
            
            const eligibleProgs = state.programs.filter(p => p.cat === candidate.cat || p.cat === 'General');
            const assigned = candidate.assignedPrograms || [];

            let html = '';
            eligibleProgs.forEach(p => {
                const isChecked = assigned.includes(p.id) ? 'checked' : '';
                html += `
                    <label class="flex items-center justify-between p-3 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer hover:bg-slate-800 transition">
                        <div>
                            <span class="text-white text-sm font-semibold block">${p.name}</span>
                            <span class="text-[10px] ${p.type === 'Stage' ? 'text-pink-400' : 'text-indigo-400'} uppercase">${p.cat} • ${p.type} ${p.isGroup ? '• 👥 GROUP' : ''}</span>
                        </div>
                        <input type="checkbox" value="${p.id}" class="prog-checkbox w-5 h-5 accent-pink-500 rounded focus:ring-pink-500" ${isChecked}>
                    </label>
                `;
            });

            document.getElementById('assignCheckboxes').innerHTML = html;
            document.getElementById('assignModal').style.display = 'flex';
        };
        
        window.closeAssign = () => {
            document.getElementById('assignModal').style.display = 'none';
            currentAssignCandidateId = null;
        };

        window.saveAssign = async () => {
            if (!currentAssignCandidateId) return;
            
            const checkboxes = document.querySelectorAll('.prog-checkbox');
            const selectedProgs = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);

            // --- PARTICIPATION LIMIT VALIDATION (General Excluded) ---
            let stageCount = 0;
            let nonStageCount = 0;
            
            selectedProgs.forEach(progId => {
                const prog = state.programs.find(p => p.id === progId);
                // ONLY count if NOT a General program
                if (prog && prog.cat !== 'General') {
                    if (prog.type === 'Stage') stageCount++;
                    if (prog.type === 'Non-Stage') nonStageCount++;
                }
            });

            if (stageCount > 3) {
                return window.showAlert(`Limit Exceeded! Max 3 Category Stage events allowed. (You selected ${stageCount})`, "error");
            }
            if (nonStageCount > 5) {
                return window.showAlert(`Limit Exceeded! Max 5 Category Non-Stage events allowed. (You selected ${nonStageCount})`, "error");
            }
            // ----------------------------------------

            const btn = document.getElementById('saveAssignBtn');
            btn.innerText = 'Saving...';
            btn.disabled = true;

            try {
                await updateDoc(doc(db, 'candidates', currentAssignCandidateId), { assignedPrograms: selectedProgs });
                window.showAlert("Events Assigned Successfully!");
                closeAssign();
            } catch (e) {
                window.showAlert("Failed to save assignments.", "error");
            } finally {
                btn.innerText = 'Save Assignments';
                btn.disabled = false;
            }
        };

        window.openEnrolled = (progId) => {
            const prog = state.programs.find(p => p.id === progId);
            if(!prog) return;

            document.getElementById('enrolledTitle').innerText = prog.name;
            let enrolled = state.candidates.filter(c => c.assignedPrograms && c.assignedPrograms.includes(progId));
            
            if (state.role && state.role !== 'admin') {
                enrolled = enrolled.filter(c => c.team === state.role);
                document.getElementById('enrolledSubtitle').innerText = `Your Team's Candidates Only`;
            } else {
                document.getElementById('enrolledSubtitle').innerText = `All Registered Candidates`;
            }

            let html = '';
            if(enrolled.length === 0) {
                html = `<p class="text-center text-slate-500 text-sm py-4">No candidates registered yet.</p>`;
            } else {
                enrolled.forEach(c => {
                    html += `
                        <div class="bg-slate-900 border border-slate-700 p-3 rounded-lg flex justify-between items-center">
                            <div>
                                <p class="text-white font-bold text-sm">${c.name} <span class="text-xs text-slate-500 font-normal">(${c.regNo})</span></p>
                                ${prog.cat === 'General' ? `<p class="text-[10px] text-slate-400 uppercase tracking-widest">${c.cat}</p>` : ''}
                            </div>
                            <span class="text-[10px] font-black uppercase px-2 py-1 rounded bg-slate-950 border border-slate-800 ${state.teams[c.team]?.color}">${state.teams[c.team]?.name}</span>
                        </div>
                    `;
                });
            }

            document.getElementById('enrolledList').innerHTML = html;
            document.getElementById('enrolledModal').style.display = 'flex';
        };

        window.closeEnrolled = () => {
            document.getElementById('enrolledModal').style.display = 'none';
        };

        // --- CORE ACTIONS ---
        window.handleLogin = (e) => {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            const pass = document.getElementById('loginPass').value;
            
            if (state.teams[role] && state.teams[role].pass === pass) {
                state.role = role;
                sessionStorage.setItem('aura_role', role);
                state.tab = 'dashboard';
                state.tvMode = false;
                window.showAlert("Secure Database Connected!");
                render();
            } else {
                window.showAlert("Invalid Password!", "error");
            }
        };

        window.handleLogout = () => {
            state.role = null;
            sessionStorage.removeItem('aura_role');
            render();
        };

        window.switchTab = (tab) => {
            state.tab = tab;
            render();
        };

        window.toggleTVMode = () => {
            state.tvMode = !state.tvMode;
            render();
            if(state.tvMode && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(e => console.log(e));
            } else if (!state.tvMode && document.fullscreenElement) {
                document.exitFullscreen().catch(e => console.log(e));
            }
        };

        window.toggleChampions = async () => {
            try {
                await updateDoc(doc(db, 'settings', 'config'), { showChampions: !state.showChampions });
                window.showAlert(state.showChampions ? "Champions Hidden on TV!" : "Champions Revealed on TV!");
            } catch(e) {
                window.showAlert("Failed to toggle TV mode.", "error");
            }
        };

        window.editTeamName = (teamKey, currentName) => {
            window.openPrompt(`Edit Team Name`, currentName, async (newName) => {
                if(!newName || newName === currentName) return;
                const updatedTeams = { ...state.teams };
                updatedTeams[teamKey].name = newName;
                try {
                    await updateDoc(doc(db, 'settings', 'config'), { teams: updatedTeams });
                    window.showAlert("Team Name Updated!");
                } catch(e) { window.showAlert("Failed to update.", "error"); }
            });
        };

        window.editProgramName = (progId, currentName) => {
            window.openPrompt(`Edit Program Name`, currentName, async (newName) => {
                if(!newName || newName === currentName) return;
                const updatedProgs = state.programs.map(p => p.id === progId ? { ...p, name: newName } : p);
                try {
                    await updateDoc(doc(db, 'settings', 'config'), { programs: updatedProgs });
                    window.showAlert("Program Name Updated!");
                } catch(e) { window.showAlert("Failed to update.", "error"); }
            });
        };

        window.editParticipant = (id, currentName) => {
            window.openPrompt(`Edit Participant Name`, currentName, async (newName) => {
                if(!newName || newName === currentName) return;
                try {
                    await updateDoc(doc(db, 'candidates', id), { name: newName });
                    window.showAlert("Participant Name Updated!");
                } catch(e) { window.showAlert("Failed to update.", "error"); }
            });
        };

        window.addNewProgram = async (e) => {
            e.preventDefault();
            const name = document.getElementById('newProgName').value;
            const cat = document.getElementById('newProgCat').value;
            const type = document.getElementById('newProgType').value;
            const isGroup = document.getElementById('newProgMode').value === 'true';
            const id = 'p' + Date.now(); 

            const newProg = { id, name, cat, type, isGroup };
            const updatedProgs = [...state.programs, newProg];
            
            try {
                await updateDoc(doc(db, 'settings', 'config'), { programs: updatedProgs });
                window.showAlert("New Program Added!");
                e.target.reset();
            } catch(err) { window.showAlert("Failed to add program", "error"); }
        };

        window.addCandidate = async (e) => {
            e.preventDefault();
            if (!state.user) return window.showAlert("Database not connected!", "error");

            const name = document.getElementById('cName').value;
            const cat = document.getElementById('cCat').value;
            const team = state.role === 'admin' ? document.getElementById('cTeam').value : state.role;

            // --- AUTO CHEST NUMBER GENERATION ---
            const prefix = cat === 'Junior' ? 'J' : 'S';

                                                    <div class="flex items-center gap-2"><span class="text-lg">🥉</span> <p class="text-amber-600 font-semibold text-sm truncate">${c3.name}</p></div> 
                                                    <span class="text-[9px] uppercase font-bold text-slate-400 bg-slate-950 px-2 py-1 rounded border border-slate-800 flex-shrink-0">${state.teams[c3.team]?.name}</span>
                                                </div>` : ''}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>`;
            }

            app.innerHTML = `
                <header class="bg-slate-950/90 backdrop-blur-xl border-b border-slate-800 p-4 px-6 flex justify-between items-center sticky top-0 z-50">

                            <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">User: <span class="text-white">${state.teams[state.role]?.name || state.role}</span></p>

                    <button onclick="handleLogout()" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold uppercase tracking-widest transition border border-slate-700 shadow-sm">Sign Out</button>

                ${navHtml}

        }
    </script>
